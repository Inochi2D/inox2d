[workspace]
resolver = "2"
members = [
    "inox2d",
    "inox2d-opengl",
    "examples/*",
]
[package]
name = "inox2d-napi"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "inox2d_napi"

[package.metadata.napi]
targets = [
  "x86_64-pc-windows-msvc",
  "i686-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu"
]

[dependencies]
napi = { version = "2.16.1", default-features = false, features = ["napi4", "async"] }
napi-derive = "2.16.1"
inox2d = { path = "./inox2d" }
chrono = "0.4"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
